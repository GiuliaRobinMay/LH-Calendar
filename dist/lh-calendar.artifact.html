/* ============================================================================
   Lesko Help — Grant Calendar
   Built to be read, not admired. Big type, plenty of air, few controls.
   Light only, on purpose. No theme variants anywhere in this file.
   ========================================================================== */

:root {
  color-scheme: light;

  --cream:       #FDF4E7;
  --cream-deep:  #F7E9D4;
  --paper:       #FFFFFF;
  --ink:         #12213F;
  --ink-soft:    #47546E;
  --ink-faint:   #7C879B;
  --rule:        #E7DCC9;
  --rule-strong: #CFC0A6;

  /* Four colours. The same four as the frame stripes. Nothing else. */
  --blue:  #2B62D9;
  --red:   #E5372C;
  --gold:  #F2C230;
  --green: #0F9D58;
  --gold-deep: #C79A05;

  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body:    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --card: 0 1px 2px rgba(18,33,63,.05), 0 8px 24px -14px rgba(18,33,63,.16);
  --frame: 6px;
  --frame-block: 44px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;            /* larger than usual, on purpose */
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

/* Form controls do NOT inherit colour — they fall back to the browser's own
   `buttontext`, which turns white inside a dark-scheme frame. Every card here
   is a <button>, so pin the colour once and the whole class of bug is gone. */
button, input, select, textarea, optgroup {
  color: var(--ink);
  font-family: var(--body);
}
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }

/* ------------------------------------------------------------------ FRAME */
.frame > i { position: fixed; z-index: 60; display: block; }
.frame .fr-top, .frame .fr-bottom {
  left: 0; right: 0; height: var(--frame);
  background: repeating-linear-gradient(90deg,
    var(--blue)  0                            var(--frame-block),
    var(--red)   var(--frame-block)           calc(var(--frame-block) * 2),
    var(--gold)  calc(var(--frame-block) * 2) calc(var(--frame-block) * 3),
    var(--green) calc(var(--frame-block) * 3) calc(var(--frame-block) * 4));
}
.frame .fr-top { top: 0; }
.frame .fr-bottom { bottom: 0; }
.frame .fr-left, .frame .fr-right {
  top: 0; bottom: 0; width: var(--frame);
  background: repeating-linear-gradient(180deg,
    var(--blue)  0                            var(--frame-block),
    var(--red)   var(--frame-block)           calc(var(--frame-block) * 2),
    var(--gold)  calc(var(--frame-block) * 2) calc(var(--frame-block) * 3),
    var(--green) calc(var(--frame-block) * 3) calc(var(--frame-block) * 4));
}
.frame .fr-left { left: 0; }
.frame .fr-right { right: 0; }
@media (max-width: 720px) { :root { --frame: 5px; --frame-block: 32px; } }

.shell {
  max-width: 760px;           /* one comfortable column, never a dashboard */
  margin: 0 auto;
  padding: calc(var(--frame) + 22px) calc(var(--frame) + 20px) calc(var(--frame) + 50px);
}

/* --------------------------------------------------------------- MASTHEAD */
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  background: var(--blue); color: #fff; display: grid; place-items: center;
  font-family: var(--display); font-size: 23px; line-height: 1;
}
.brand-name { font-family: var(--display); font-size: 19px; line-height: 1.12; }
.brand-name em { display: block; color: var(--red); font-style: italic; font-size: 17px; }
.brand-name b { display: block; font-weight: 500; }
.suits { display: flex; gap: 9px; font-size: 17px; line-height: 1; }
.suit-blue { color: var(--blue); } .suit-red { color: var(--red); }
.suit-gold { color: var(--gold-deep); } .suit-green { color: var(--green); }

h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; text-wrap: balance; }

.page-title {
  margin: 26px 0 0;
  font-size: clamp(36px, 7vw, 54px); line-height: 1.03; letter-spacing: -.02em;
}
.page-title em { color: var(--red); font-style: italic; }

/* ------------------------------------------------------------ TWO FACTS */
/* The whole idea of the page, before anything moves or asks for a click. */
.facts { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
.fact {
  display: flex; gap: 15px; align-items: flex-start;
  padding: 18px 20px; border-radius: 16px;
}
.fact-always { background: #E9F5ED; border: 2px solid var(--green); }
.fact-season { background: var(--cream-deep); border: 2px solid var(--gold); }
.fact-mark { font-size: 24px; line-height: 1.25; flex: none; }
.fact-always .fact-mark { color: var(--green); font-weight: 700; }
.fact h2 { font-size: 22px; line-height: 1.2; }
.fact p { margin: 5px 0 0; font-size: 16.5px; color: var(--ink-soft); }

/* ------------------------------------------------------------- OPEN NOW */
.now {
  margin-top: 26px; padding: 22px;
  background: var(--paper); border: 1px solid var(--rule);
  border-radius: 18px; box-shadow: var(--card);
}
.now-month {
  display: inline-block; font-size: 14px; font-weight: 700;

}
.now-head h2 { font-size: 26px; line-height: 1.15; margin-top: 3px; }

.now-list { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }
.now-item {
  display: flex; align-items: center; gap: 13px;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--cream); border: 2px solid var(--rule);
  border-radius: 13px; padding: 14px 16px;
}
.now-item:hover { border-color: var(--c); background: var(--cream-deep); }
.now-dot {
  width: 15px; height: 15px; flex: none; border-radius: 50%;
  background: var(--c);
}
.now-body { display: block; }
.now-name { display: block; font-size: 18px; font-weight: 700; line-height: 1.25; }
.now-note { display: block; font-size: 15px; color: var(--ink-soft); margin-top: 1px; }
.now-item.is-last { border-color: var(--red); background: #FDEDEC; }
.now-item.is-last .now-note { color: var(--red); font-weight: 600; }

.now-none { margin: 12px 0 0; font-size: 16px; color: var(--ink-soft); }
.now-soon {
  margin: 15px 0 0; padding-top: 14px; border-top: 1px solid var(--rule);
  font-size: 15.5px; color: var(--ink-soft);
}
.now-soon b { color: var(--ink); }

/* ---------------------------------------------------------- THE SEVEN */
.grants { margin-top: 34px; }
.sec-title { font-size: 27px; line-height: 1.15; }
.sec-sub { margin: 5px 0 0; font-size: 16px; color: var(--ink-soft); }
#grants { margin-top: 16px; display: flex; flex-direction: column; gap: 13px; }

.grant {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--paper); border: 2px solid var(--rule);
  border-radius: 16px; padding: 18px 20px; box-shadow: var(--card);
}
.grant:hover { border-color: var(--c); }
.grant.is-open { border-color: var(--c); }

.grant-top { display: flex; align-items: flex-start; gap: 14px; }
.grant-top h3 { font-size: 22px; line-height: 1.2; }
.grant-when { font-size: 15.5px; color: var(--ink-soft); margin-top: 2px; }

.tag {
  flex: none; margin-left: auto;
  font-size: 12.5px; font-weight: 700; letter-spacing: .05em;
  padding: 5px 11px; border-radius: 999px; white-space: nowrap;
}
.tag-open { background: var(--green); color: #fff; }
.tag-shut { background: var(--cream-deep); color: var(--ink-soft); }

/* ---------------------------------------------------------- MONTH STRIP */
/* Twelve blocks, filled where the grant is open. No legend, no key — the
   picture is the explanation. */
.strip {
  margin-top: 14px;
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px;
}
.strip-m {
  height: 34px; border-radius: 5px;
  background: var(--cream-deep);
  display: grid; place-items: center;
}
.strip-m .strip-l {
  font-size: 12px; font-weight: 700; color: var(--ink-faint);
}
/* The label colour is set in JS from the real contrast ratio — gold needs
   dark text, the other three need white. An attribute selector on the inline
   style would not survive the browser rewriting it as rgb(). */
.strip-m.is-now { outline: 3px solid var(--ink); outline-offset: 1px; }

.grant-what { margin: 14px 0 0; font-size: 16.5px; color: var(--ink-soft); }
.grant-more {
  display: inline-block; margin-top: 11px;
  font-size: 15px; font-weight: 700; color: var(--red);
}

/* ---------------------------------------------------------- THIS MONTH */
.thismonth {
  margin-top: 34px; padding: 22px;
  background: var(--cream-deep); border-radius: 18px;
  border-left: 6px solid var(--red);
}
.month-line { margin: 5px 0 0; font-size: 17.5px; color: var(--ink); }
.month-todo { margin: 15px 0 0; padding-left: 24px; }
.month-todo li { font-size: 16.5px; color: var(--ink-soft); margin-bottom: 9px; }

/* ---------------------------------------------------------------- CARD */
.sheet { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; }
.sheet[hidden] { display: none; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(18,33,63,.45); border: none; }
.sheet-card {
  position: relative; z-index: 1;
  width: min(540px, 100%); max-height: min(86vh, 760px); overflow-y: auto;
  background: var(--paper); border-radius: 20px;
  border-top: 8px solid var(--c, var(--ink));
  padding: 26px 26px 28px;
  box-shadow: 0 24px 64px -18px rgba(18,33,63,.45);
}
.sheet-x {
  position: absolute; top: 14px; right: 16px;
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid var(--rule-strong); background: var(--paper);
  font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink-soft);
}
.sheet-x:hover { background: var(--cream-deep); }

.sheet-card h3 { font-size: 29px; line-height: 1.12; padding-right: 40px; }
.sheet-when { margin-top: 6px; font-size: 16px; font-weight: 600; color: var(--ink-soft); }
.sheet-h {
  margin-top: 20px; font-size: 14px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint);
}
.sheet-p { margin: 6px 0 0; font-size: 17px; color: var(--ink-soft); }
.sheet-flag {
  margin-top: 18px; padding: 13px 15px;
  background: var(--cream-deep); border-left: 4px solid var(--gold);
  border-radius: 0 10px 10px 0; font-size: 16px; line-height: 1.5;
}

/* --------------------------------------------------------------- FOOTER */
.foot {
  margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--rule);
  font-size: 15px; color: var(--ink-faint);
}

@media (max-width: 560px) {
  body { font-size: 16px; }
  .strip-m { height: 30px; }
  .strip-m .strip-l { font-size: 10.5px; }
  .grant-top { flex-wrap: wrap; }
  .tag { margin-left: 0; }
}

</style>

<script>
/* ============================================================================
   Lesko Help — Grant Calendar
   ----------------------------------------------------------------------------
   Source: "Grant Strategy Calendar, 2026 Edition" — Fund-Nation.

   WRITTEN FOR SOMEONE WHO KNOWS NOTHING ABOUT GRANTS.
   Short sentences. Everyday words. No jargon.

   Words we do NOT use here, and what we say instead:
       funder / funding cycle  ->  who gives the money / when they open
       portal                  ->  the form, applying online
       proposal / application  ->  your form
       Community Reinvestment  ->  banks have to give money back locally
       fiscal year, LOI, CRA   ->  cut entirely

   THE ONE IDEA THIS PAGE EXISTS TO TEACH
   Most grants have no deadline — apply any day. Only a few open at set times
   of year. Those few are the ones you can miss, so those are the ones here.

   HOW TO EDIT
   Months are numbers, 0 = January. `from` and `to` are the first and last
   month a grant is open. If it runs across New Year, put the bigger number
   first (e.g. from 10, to 1 = November to February).

   Last review: 2026-09-10.
   ========================================================================== */

const LH_INTRO = {
  title: 'When can I apply?',
  alwaysHeading: 'Most grants have no deadline',
  alwaysBody: 'You can apply on any day of the year. You do not have to wait ' +
              'for a special date. If you find a grant that fits you, apply.',
  seasonHeading: 'A few only open at certain times',
  seasonBody: 'These are the ones people miss. They open, they close, and then ' +
              'you wait a year. There are seven of them. They are all below.',
};

/* ------------------------------------------------------------- THE COLOURS */
/* Four only — the Lesko blue, red, gold and green. */
const LH_COLORS = {
  blue:  '#2B62D9',
  red:   '#E5372C',
  gold:  '#F2C230',
  green: '#0F9D58',
};

/* ------------------------------------------------------------- THE GRANTS */
/* Seven kinds of grant with a season. That is the whole list.

   Note on what is NOT here: the source also has a January planning month and
   a November-to-January stretch for getting to know your bank. Neither is a
   grant you apply for, so putting them in this list only made it longer and
   more confusing. They live in the monthly advice instead. */

const LH_GRANTS = [
  {
    id: 'bank',
    name: 'Bank grants',
    color: 'blue',
    from: 1, to: 9,                 // February to October
    when: 'February to October',
    what: 'Banks have to give money back to their local area. So they give ' +
          'grants to groups near them.',
    tip: 'Go into your bank and meet the manager before you apply. Banks give ' +
         'to people they already know. The best time to do that is November ' +
         'and December, months before the form even opens.',
    heads: 'This one is open the longest, so it is easy to think you have time. ' +
           'Send your form early.',
  },
  {
    id: 'foundation',
    name: 'Foundation grants',
    color: 'red',
    from: 2, to: 2,                 // March
    when: 'March',
    what: 'Foundations are set up to give money away. Each one has its own ' +
          'list of what it pays for.',
    tip: 'Read their website first and see what they pay for. Then phone them ' +
         'and ask: is there anything I should know that is not on your website?',
  },
  {
    id: 'federal',
    name: 'Government grants',
    color: 'gold',
    from: 3, to: 4,                 // April to May
    when: 'April and May',
    what: 'Money from the US government. The forms are longer and they ask ' +
          'for more.',
    tip: 'Start in April even though most open in May. Phone the office for ' +
         'your area and introduce yourself. It is free and they will remember you.',
    heads: 'These take the most time to fill in. Do not leave them to the last week.',
  },
  {
    id: 'state',
    name: 'State grants',
    color: 'green',
    from: 5, to: 5,                 // June
    when: 'June',
    what: 'Money from your own state, for groups working in that state.',
    tip: 'Have your money papers ready before June. They will ask to see them.',
  },
  {
    id: 'local',
    name: 'Local grants',
    color: 'blue',
    from: 6, to: 6,                 // July
    when: 'July',
    what: 'Small grants from local businesses and local groups.',
    tip: 'Go where they are. Local meetings, town events, clubs. Be a face ' +
         'they know before you are a name on a form.',
  },
  {
    id: 'company',
    name: 'Shop & company grants',
    color: 'red',
    from: 7, to: 7,                 // August
    when: 'August',
    what: 'Big shops and companies give money to groups near their stores.',
    tip: 'Walk into the shop and ask for the manager. This almost never ' +
         'starts online. It starts with a person.',
  },
  {
    id: 'yearend',
    name: 'Year-end giving',
    color: 'gold',
    from: 10, to: 11,               // November to December
    when: 'November and December',
    what: 'Not a form. This is when people give the most money to good causes.',
    tip: 'Ask your supporters. Tell them what you did this year. Then thank ' +
         'everyone, whether they gave or not.',
  },
];

/* --------------------------------------------------------- MONTHLY ADVICE */
/* One short line for each month, and up to three things to do. Plain words. */

const LH_MONTHS = [
  { name: 'January',
    line: 'Nothing is due. This is the month to get ready.',
    todo: ['Decide which grants you want this year.',
           'Get your papers and money records up to date.',
           'Start saying hello to people who give money. Do not ask for any yet.'] },
  { name: 'February',
    line: 'Bank grants open this month.',
    todo: ['Find out which banks near you are open for grants.',
           'Send your form early, not on the last day.',
           'Go in and meet your bank in person.'] },
  { name: 'March',
    line: 'Foundations are the focus.',
    todo: ['Read what each one pays for before you write anything.',
           'Phone and ask them a question. It shows you are serious.',
           'Ask someone local and well known to say a good word for you.'] },
  { name: 'April',
    line: 'Start on government grants now.',
    todo: ['Begin the paperwork. It takes longer than you think.',
           'Introduce yourself to your local government office.',
           'Ask another group to work with you on the bigger ones.'] },
  { name: 'May',
    line: 'Government grants open.',
    todo: ['Check you meet every rule they ask for.',
           'Ask the people who already fund you who else you should meet.',
           'Be ready to change your form if their rules change.'] },
  { name: 'June',
    line: 'State grants, and a look back at your year so far.',
    todo: ['Look for grants from your own state.',
           'Check how the year is going and what to change.',
           'Send a short update to everyone you spoke to. Even the ones who said no.'] },
  { name: 'July',
    line: 'Local grants and local people.',
    todo: ['Look for grants from local businesses.',
           'Go to local events so people see you.',
           'Say clearly how your work helps the area.'] },
  { name: 'August',
    line: 'Shops and companies. Also, get ready for autumn.',
    todo: ['Walk into local shops and ask about grants.',
           'Update your forms with what you did this year.',
           'Autumn is the busy season. Get ready now.'] },
  { name: 'September',
    line: 'Bank grants close soon. Do not wait.',
    todo: ['Phone your bank and check the closing date yourself.',
           'Send them what your group has done this year.',
           'Start planning your end-of-year fundraising.'] },
  { name: 'October',
    line: 'Last chance for bank grants.',
    todo: ['Send every bank form before the date.',
           'Write down your good news stories for the end of year.',
           'Thank everyone who met you this year, even the ones who said no.'] },
  { name: 'November',
    line: 'Ask your supporters. And start on next February.',
    todo: ['Run your end-of-year ask.',
           'Collect thank-you notes and stories from people you helped.',
           'Help out at your bank’s events. This is what gets you funded in February.'] },
  { name: 'December',
    line: 'The biggest giving month of the year.',
    todo: ['Ask people to give before the year ends.',
           'Say thank you to everyone.',
           'Keep turning up at local events. Be useful, not pushy.'] },
];

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { LH_INTRO, LH_COLORS, LH_GRANTS, LH_MONTHS };
}

<script>
/* ============================================================================
   Lesko Help — Grant Calendar

   Built for someone who has never applied for a grant. It answers, in order:

     1. Do I have to wait?          Mostly no.
     2. What can I do right now?    This list.
     3. When does the rest open?    This strip.
     4. What should I do today?     This box.

   No navigation, no filters, no month grid. Everything is on one screen and
   works out where we are in the year on its own.
   ========================================================================== */
(function () {
  'use strict';

  var MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
  var INITIALS = ['J','F','M','A','M','J','J','A','S','O','N','D'];

  var now = new Date();
  var THIS_MONTH = now.getMonth();
  var TODAY = now.getDate();

  // Preview another month with ?month=1 (0 = January). Only for checking the
  // page reads right in, say, February.
  var q = new URLSearchParams(location.search).get('month');
  if (q !== null && /^\d+$/.test(q) && +q >= 0 && +q < 12) THIS_MONTH = +q;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function colourOf(g) { return LH_COLORS[g.color]; }

  // Gold carries dark text, the other three carry white. Worked out from the
  // real contrast ratio rather than hard-coded, so a colour change cannot
  // quietly leave a label unreadable.
  function labelOn(hex) {
    var c = [1, 3, 5].map(function (i) {
      var v = parseInt(hex.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    var L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    return (L + 0.05) / 0.0695 >= 1.05 / (L + 0.05) ? '#12213F' : '#FFFFFF';
  }

  /* -------------------------------------------------------------- MONTHS */
  // A grant can run across New Year (November to February), so "is month m
  // inside this grant" is not a simple from <= m <= to.
  function isOpenIn(g, m) {
    return g.from <= g.to ? (m >= g.from && m <= g.to)
                          : (m >= g.from || m <= g.to);
  }
  function isOpenNow(g) { return isOpenIn(g, THIS_MONTH); }

  // How many months until it opens again. Used for "opens in 2 months".
  function monthsUntilOpen(g) {
    for (var i = 0; i < 12; i++) {
      if (isOpenIn(g, (THIS_MONTH + i) % 12)) return i;
    }
    return null;
  }
  // The last month it is open, counting forward from now.
  function monthsLeftOpen(g) {
    for (var i = 0; i < 12; i++) {
      if (!isOpenIn(g, (THIS_MONTH + i) % 12)) return i - 1;
    }
    return 11;
  }

  function plural(n, one, many) { return n === 1 ? one : many; }

  /* --------------------------------------------------------- MONTH STRIP */
  // Twelve blocks. Filled where the grant is open. This is the whole
  // explanation of "when" — no legend needed, no reading required.
  function strip(g) {
    var wrap = el('div', 'strip');
    for (var m = 0; m < 12; m++) {
      var cell = el('div', 'strip-m' + (isOpenIn(g, m) ? ' on' : ''));
      if (isOpenIn(g, m)) {
        cell.style.background = colourOf(g);
        cell.style.color = labelOn(colourOf(g));
      }
      if (m === THIS_MONTH) cell.classList.add('is-now');
      var lab = el('span', 'strip-l', INITIALS[m]);
      if (isOpenIn(g, m)) lab.style.color = 'inherit';
      cell.appendChild(lab);
      cell.setAttribute('aria-hidden', 'true');
      wrap.appendChild(cell);
    }
    return wrap;
  }

  /* ============================================================ OPEN NOW */
  function renderNow() {
    var host = document.getElementById('now');
    host.textContent = '';

    var open = LH_GRANTS.filter(isOpenNow);
    var soon = LH_GRANTS.filter(function (g) {
      var u = monthsUntilOpen(g);
      return u !== null && u > 0 && u <= 2;
    });

    var head = el('div', 'now-head');
    head.appendChild(el('span', 'now-month', 'It is ' + MONTHS[THIS_MONTH]));
    head.appendChild(el('h2', null, open.length
      ? 'You can apply for ' + open.length + ' of them right now'
      : 'None of the seven are open this month'));
    host.appendChild(head);

    if (open.length) {
      var list = el('div', 'now-list');
      open.forEach(function (g) {
        var left = monthsLeftOpen(g);
        var b = el('button', 'now-item');
        b.type = 'button';
        b.style.setProperty('--c', colourOf(g));
        b.appendChild(el('span', 'now-dot'));
        var body = el('span', 'now-body');
        body.appendChild(el('span', 'now-name', g.name));
        body.appendChild(el('span', 'now-note', left === 0
          ? 'Last month — closes end of ' + MONTHS[THIS_MONTH]
          : left + ' more ' + plural(left, 'month', 'months') + ' to apply'));
        b.appendChild(body);
        if (left === 0) b.classList.add('is-last');
        b.addEventListener('click', function () { openSheet(g); });
        list.appendChild(b);
      });
      host.appendChild(list);
    } else {
      host.appendChild(el('p', 'now-none',
        'That is normal. Use this month to get ready — see the box at the bottom.'));
    }

    if (soon.length) {
      var s = el('p', 'now-soon');
      s.appendChild(el('b', null, 'Coming up: '));
      s.appendChild(document.createTextNode(soon.map(function (g) {
        var u = monthsUntilOpen(g);
        return g.name + ' opens ' + (u === 1 ? 'next month' : 'in ' + u + ' months');
      }).join('. ') + '.'));
      host.appendChild(s);
    }
  }

  /* ============================================================== GRANTS */
  function renderGrants() {
    var host = document.getElementById('grants');
    host.textContent = '';

    // Open ones first — that is what someone can act on today.
    var sorted = LH_GRANTS.slice().sort(function (a, b) {
      var oa = isOpenNow(a) ? 0 : 1, ob = isOpenNow(b) ? 0 : 1;
      return oa - ob || monthsUntilOpen(a) - monthsUntilOpen(b);
    });

    sorted.forEach(function (g) {
      var card = el('button', 'grant');
      card.type = 'button';
      card.style.setProperty('--c', colourOf(g));
      if (isOpenNow(g)) card.classList.add('is-open');

      var top = el('div', 'grant-top');
      var names = el('div');
      names.appendChild(el('h3', null, g.name));
      names.appendChild(el('div', 'grant-when', 'Open ' + g.when));
      top.appendChild(names);
      top.appendChild(el('span', 'tag ' + (isOpenNow(g) ? 'tag-open' : 'tag-shut'),
        isOpenNow(g) ? 'OPEN NOW' : 'Opens ' + MONTHS[g.from]));
      card.appendChild(top);

      card.appendChild(strip(g));
      card.appendChild(el('p', 'grant-what', g.what));
      card.appendChild(el('span', 'grant-more', 'Tap to read more'));

      card.addEventListener('click', function () { openSheet(g); });
      host.appendChild(card);
    });
  }

  /* ========================================================== THIS MONTH */
  function renderMonth() {
    var host = document.getElementById('thismonth');
    host.textContent = '';
    var m = LH_MONTHS[THIS_MONTH];

    host.appendChild(el('h2', 'sec-title', 'What to do in ' + MONTHS[THIS_MONTH]));
    host.appendChild(el('p', 'month-line', m.line));

    var ol = el('ol', 'month-todo');
    m.todo.forEach(function (t) { ol.appendChild(el('li', null, t)); });
    host.appendChild(ol);
  }

  /* ================================================================ CARD */
  var sheet = document.getElementById('sheet');
  var sheetCard = document.getElementById('sheet-card');
  var lastFocus = null;

  function openSheet(g) {
    var body = document.getElementById('sheet-body');
    body.textContent = '';
    sheetCard.style.setProperty('--c', colourOf(g));

    var h = el('h3', null, g.name);
    h.id = 'sheet-title';
    body.appendChild(h);

    body.appendChild(el('div', 'sheet-when',
      isOpenNow(g) ? 'Open now · ' + g.when : 'Opens in ' + MONTHS[g.from] + ' · ' + g.when));

    body.appendChild(strip(g));

    body.appendChild(el('div', 'sheet-h', 'What it is'));
    body.appendChild(el('p', 'sheet-p', g.what));

    body.appendChild(el('div', 'sheet-h', 'How to get it'));
    body.appendChild(el('p', 'sheet-p', g.tip));

    if (g.heads) {
      body.appendChild(el('div', 'sheet-flag', g.heads));
    }

    lastFocus = document.activeElement;
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    sheetCard.querySelector('.sheet-x').focus();
  }

  function closeSheet() {
    sheet.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  Array.prototype.forEach.call(sheet.querySelectorAll('[data-close]'), function (n) {
    n.addEventListener('click', closeSheet);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  /* ================================================================= RUN */
  document.getElementById('always-h').textContent = LH_INTRO.alwaysHeading;
  document.getElementById('always-b').textContent = LH_INTRO.alwaysBody;
  document.getElementById('season-h').textContent = LH_INTRO.seasonHeading;
  document.getElementById('season-b').textContent = LH_INTRO.seasonBody;

  renderNow();
  renderGrants();
  renderMonth();
})();

</script>
