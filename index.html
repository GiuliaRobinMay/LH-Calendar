<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant Calendar</title>
<meta name="description" content="Most grants have no deadline. A few only open at certain times of year. Here are those few, and when they open.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="frame" aria-hidden="true">
  <i class="fr-top"></i><i class="fr-bottom"></i><i class="fr-left"></i><i class="fr-right"></i>
</div>

<div class="shell">

  <header class="masthead">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">?</div>
      <div class="brand-name"><em>Lesko</em><b>Help</b></div>
    </div>
    <div class="suits" aria-hidden="true">
      <span class="suit-blue">&spades;</span>
      <span class="suit-red">&hearts;</span>
      <span class="suit-gold">&diams;</span>
      <span class="suit-green">&clubs;</span>
    </div>
  </header>

  <h1 class="page-title">When can I <em>apply?</em></h1>

  <!-- The whole idea, in two boxes, before anything else. -->
  <section class="facts">
    <div class="fact fact-always">
      <span class="fact-mark" aria-hidden="true">✓</span>
      <div>
        <h2 id="always-h"></h2>
        <p id="always-b"></p>
      </div>
    </div>
    <div class="fact fact-season">
      <span class="fact-mark" aria-hidden="true">📅</span>
      <div>
        <h2 id="season-h"></h2>
        <p id="season-b"></p>
      </div>
    </div>
  </section>

  <!-- The live answer. -->
  <section class="now" id="now"></section>

  <!-- The seven, each with its months drawn as a strip. -->
  <section class="grants">
    <h2 class="sec-title">The seven grants with a season</h2>
    <p class="sec-sub">The coloured blocks show the months each one is open.</p>
    <div id="grants"></div>
  </section>

  <!-- What to do, right now, this month. -->
  <section class="thismonth" id="thismonth"></section>

  <footer class="foot">
    Dates are guides, not promises. Always check with the bank, foundation or
    office before you send anything.
  </footer>

</div>

<!-- Tap a grant to read more. -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-card">
    <button type="button" class="sheet-x" data-close aria-label="Close">&times;</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="data/calendar.js"></script>
<script src="assets/calendar.js"></script>
</body>
</html>
